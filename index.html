<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo Secreto de Natal</title>
<style>
:root{--bg:#fbf6ef;--card:#ffffff;--ink:#2b1d1a;--muted:#7a6a63;--accent:#b3261e;--green:#1f6b45;--line:#eadfd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1413;--card:#2a1e1c;--ink:#f6ece6;--muted:#b9a79f;--accent:#ff6b5f;--green:#6fd4a0;--line:#43322f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1413;--card:#2a1e1c;--ink:#f6ece6;--muted:#b9a79f;--accent:#ff6b5f;--green:#6fd4a0;--line:#43322f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.emoji{font-size:48px}
h1{font-size:24px;margin:8px 0 6px}
p{color:var(--muted);line-height:1.5;margin:8px 0}
button{margin-top:18px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-size:17px;font-family:inherit;cursor:pointer}
.name{font-size:38px;color:var(--green);font-weight:bold;margin:14px 0;word-break:break-word}
.hide{display:none}
</style></head><body>
<div class="card">
<div class="emoji" id="emoji">🎄</div>
<h1 id="title">Amigo Secreto de Natal</h1>
<p id="msg"></p>
<div class="name hide" id="result"></div>
<button id="btn" class="hide">Descobrir meu amigo secreto</button>
</div>
<script>
var DATA = {"7c6bbc3c": "JxYZAkRGCE1rA1Aa", "751b0d72": "PxtasMkCAxpCCjUUCAdQGgs=", "f3f934b6": "JgUAHlxcDQg9HlJUDA==", "abe1b6f0": "JBwYXgQYTH0NQh0=", "7cad97a0": "ORcVER8bZRlaAhcWFg==", "f50a1d0b": "JQoSCSpQ", "c769c127": "PxsRPQ4C", "39fb7572": "NBtQCyBSXBkdBwMY", "9a24d312": "NBgICREaIBhQHwYU", "68b0c017": "aw0fCwUGGj9WHwkN", "64f7a726": "YxcJSloIAh4KdgsJXR0=", "c1cf5855": "I1NeURpiAxcYGxZX", "83de7210": "NRRcARsJZxsBtM9XHhNK", "346f5154": "JxoUCBppDx4YGgo=", "9b1f2e0a": "PVgDGhgBUk8yE1g="};
function fnv(s){var h=2166136261,b=new TextEncoder().encode(s);for(var i=0;i<b.length;i++){h=((h^b[i])*16777619)>>>0;}return h.toString(16);}
function decode(tok){
  var enc=DATA[fnv(tok)]; if(!enc) return null;
  try{
    var bin=atob(enc),key=new TextEncoder().encode(tok),out=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++){out[i]=bin.charCodeAt(i)^key[i%key.length];}
    var parts=new TextDecoder().decode(out).split("|");
    return parts.length===2?{me:parts[0],friend:parts[1]}:null;
  }catch(e){return null;}
}
var msg=document.getElementById("msg"),btn=document.getElementById("btn"),res=document.getElementById("result");
function render(){
  var tok=(location.hash||"").replace("#","").trim().toLowerCase();
  res.classList.add("hide");btn.classList.add("hide");
  document.getElementById("emoji").textContent="🎄";
  if(!tok){document.getElementById("title").textContent="Amigo Secreto de Natal";msg.textContent="Abra o link pessoal que você recebeu para descobrir quem você tirou.";return;}
  var r=decode(tok);
  if(!r){document.getElementById("title").textContent="Link inválido";msg.textContent="Esse link não funcionou. Confira se ele foi copiado por inteiro.";return;}
  document.getElementById("title").textContent="Olá, "+r.me+"!";
  msg.textContent="Seu amigo secreto está guardado aqui. Garanta que ninguém esteja olhando a sua tela e toque no botão.";
  btn.classList.remove("hide");
  btn.onclick=function(){
    document.getElementById("emoji").textContent="🎁";
    msg.textContent="Você tirou:";
    res.textContent=r.friend;res.classList.remove("hide");btn.classList.add("hide");
  };
}
window.addEventListener("hashchange",render);render();
</script></body></html>
